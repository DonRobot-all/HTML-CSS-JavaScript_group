<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя первая страница</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <style>
        body {
            /* background-color: rgb(174, 216, 216); */
            background: linear-gradient(0deg, #3438b9, #a1c4fd);
            min-height: 100vh;
        }
        div {
            margin-left: 40%;
            margin-right: 40%;
            margin-top: 5%;
            text-align: center ;
            border: 3px solid;
            border-radius: 50px;
            background-color: antiquewhite;
            box-shadow: 0 -26px 20px rgba(0, 76, 153, 0.25);
            font-family: "Caveat"
        }
        ul {
            display: inline-block;
        }
        button {
            margin-bottom: 20px;
        }
        button:hover {
            transform: scale(2.06);
            transition: 2s ease;
        }
    </style>
</head>
<body>

<div>
    <h1> Обо мне</h1>
    <a> Текст который рассказывает обо мне</a>
    <hr>
    <h3> Самые лучшие качества</h3>
    <ul>
        <li>1 качество</li>
        <li>2 качество</li>
        <li>3 качество</li>
    </ul>
    <br>
    <button>Игра в доту срочно!</button>
</div>

</body>
</html>
