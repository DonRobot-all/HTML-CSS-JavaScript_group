<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обо мне</title>
    <style>
        /* Меняем цвет фона всей страницы */
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Оформляем карточку */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin: 40px auto;
            width: 320px;
            border: 2px solid #4da6ff;
        }

        h1 {
            color: #005c99;
        }

        .hobbies {
            text-align: left;
            display: inline-block;
        }

        /* Меняем цвет и вид кнопки */
        button {
            background-color: #ff7043;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет, меня зовут Аня!</h1>
        <p>Мне 12 лет, я учусь программировать и очень люблю котиков.</p>

        <hr>

        <p><span style="color: #ff7043; font-weight: bold;">Мои увлечения:</span></p>
        <ul class="hobbies">
            <li>Рисование</li>
            <li>Программирование</li>
            <li>Настольные игры</li>
        </ul>

        <p>Подробнее обо мне на <a href="https://example.com">моей странице</a>.</p>

        <button>Написать мне</button>
    </div>

</body>
</html>
