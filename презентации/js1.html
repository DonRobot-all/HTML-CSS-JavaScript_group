<!DOCTYPE html>
<!-- УРОВЕНЬ 1 · САМЫЙ ЛЁГКИЙ · «Счётчик кубков»
     Что нужно знать: переменная let, функция, if, getElementById,
     textContent, addEventListener("click", ...), style.color -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Счётчик кубков</title>

  <style>
    body {
      background: #1d1b4b;
      color: #fff;
      font-family: Verdana, sans-serif;
      text-align: center;
      padding: 30px 16px;
    }
    h1 { color: #ffe14d; }

    /* Табло с числом */
    .board {
      background: #2d2a6e;
      border: 4px solid #ffe14d;
      border-radius: 20px;
      max-width: 420px;
      margin: 20px auto;
      padding: 24px;
    }
    #count { font-size: 90px; font-weight: bold; margin: 0; }
    #rank  { font-size: 26px; margin: 6px 0 0; }

    button {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 20px;
      margin: 6px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .win   { background: #3df5c8; }
    .lose  { background: #ff7a7a; }
    .reset { background: #ddd; }
    button:hover { filter: brightness(1.15); }
  </style>
</head>

<body>
  <h1>Счётчик кубков</h1>
  <p>Нажимай на кнопки и смотри, как растёт твой уровень.</p>

  <div class="board">
    <p id="count">0</p>
    <p id="rank">Бронза</p>
  </div>

  <button class="win"   id="btnWin">Победа +8</button>
  <button class="lose"  id="btnLose">Поражение −4</button>
  <button class="reset" id="btnReset">Сначала</button>

  <p style="color:#aaaadd">Числа придуманы для урока.</p>

  <script>
    // 1. Переменная: здесь хранится число кубков
    let count = 0;

    // 2. Находим элементы страницы по id
    const countEl = document.getElementById("count");
    const rankEl  = document.getElementById("rank");

    // 3. Функция: по числу кубков возвращает название уровня
    function getRank(n) {
      if (n >= 600) return "Алмаз";
      if (n >= 300) return "Золото";
      if (n >= 100) return "Серебро";
      return "Бронза";
    }

    // 4. Функция: обновляет то, что видно на экране
    function render() {
      countEl.textContent = count;           // меняем текст
      rankEl.textContent  = getRank(count);

      // цвет числа зависит от уровня
      if (count >= 600)      countEl.style.color = "#4dd2ff";
      else if (count >= 300) countEl.style.color = "#ffd21f";
      else if (count >= 100) countEl.style.color = "#cfd3e6";
      else                   countEl.style.color = "#d9954a";
    }

    // 5. Функция: меняет число кубков на step
    function change(step) {
      count = count + step;
      if (count < 0) {
        count = 0;                            // меньше нуля быть не может
      }
      render();
    }

    // 6. Подписываемся на клики по кнопкам
    document.getElementById("btnWin").addEventListener("click", function () {
      change(8);
    });
    document.getElementById("btnLose").addEventListener("click", function () {
      change(-4);
    });
    document.getElementById("btnReset").addEventListener("click", function () {
      count = 0;
      render();
    });

    // 7. Показываем начальное состояние
    render();
  </script>
</body>
</html>
