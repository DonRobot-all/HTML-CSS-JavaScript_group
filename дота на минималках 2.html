<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбери героя</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #260044;
        color: white;
        }

    .page-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        /* overflow: hidden; */
        /* background: #260044; */
    }

    .hero-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        /* background-position: center;
        background-repeat: no-repeat; */
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
    }

    .hero-bg.active {
        opacity: 1;
    }

    /* .page-background::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            90deg,
            rgba(30, 0, 50, 0.8),
            rgba(30, 0, 50, 0.35)
        );
        pointer-events: none;
    } */

    .site-content {
        position: relative;
        z-index: 1;
        min-height: 100vh;
    }

    /* .hero {
        min-height: 400px;
        padding: 50px;
    } */

    .hero-icon {
        width: 160px;
        transition: all 0.4s ease;
    }
    .site-content {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 24px;
        border-radius: 16px;
        width: 280px;
        text-align: center;
        margin-left: 40%;

        transition: background-color 0.6s ease;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
        font-size: 15px;
    }

    button {
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #e67e22;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #d35400;
    }

    #greeting {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
    }
    .stats {
        margin-top: 10px;
        width: 280px;
        text-align: left;
    }

    .stat-label {
        font-size: 14px;
        margin-bottom: 2px;
    }

    .bar-background {
        width: 100%;
        height: 14px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 7px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .bar-fill {
        height: 100%;
        transition: width 0.5s ease, background-color 0.5s ease;
    }
</style>
</head>
<body>
    <!-- Теги для фона, меняются -->
    <div class="page-background">
        <div class="hero-bg active"
            style="background-image: url('images/1.jpeg')"></div>

        <div class="hero-bg"
            style="background-image: url('images/2.jpg')"></div>

        <div class="hero-bg"
            style="background-image: url('images/3.jpg')"></div>
    </div>

    <!-- Всё остальное, что было до этого -->
    <div class="site-content">
        <img class="hero-icon" id="heroIcon" src="images/Dota.png">

        <form id="heroForm">
            <input type="text" id="nickname" placeholder="Твой ник" required>

            <select id="heroSelect">
                <option value="Pudge">Pudge</option>
                <option value="Shadow_Field">Shadow_Field</option>
                <option value="Witch_Doctor">Witch Doctor</option>
                <option value="Shadow_Shaman">Shadow Shaman</option>
            </select>

            <button type="submit">Выбрать героя</button>
        </form>

        <!-- Это нужно для будущего вывода текста, изначально на странице - пусто -->
        <p id="greeting"></p> 
        <div class="stats">
            <div class="stat-label"> Здоровье: <span id=hpValue></span></div>
            <div class="bar-background"><div class="bar-fill" id="hpBar" style="background-color: #2ecc71;"></div></div>

            <div class="stat-label"> Урон: <span id=damageValue></span></div>
            <div class="bar-background"><div class="bar-fill" id="damageBar" style="background-color: #e74c3c;"></div></div></div>    
    </div>
    <script>
        const heroes = {
            Pudge:    { color: "#4a148c", icon: "images/Pudge.png", hp:670 , damage: 70},
            Shadow_Field: { color: "#b71c1c", icon: "images/Shadow_Field.png", hp:538 , damage: 41},
            Witch_Doctor:  { color: "#1b5e20", icon: "images/Witch_Doctor.png", hp:560 , damage: 48 },
            Shadow_Shaman:  { color: "#212121", icon: "images/Shadow_Shaman.png", hp:560 , damage: 63 }
        };

        const maxHp = 670;
        const maxDamage = 70;
        const form = document.getElementById("heroForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const nickname = document.getElementById("nickname").value;
            const heroKey = document.getElementById("heroSelect").value;

            const hero = heroes[heroKey];

            document.body.style.backgroundColor = hero.color;

            document.getElementById("heroIcon").src = hero.icon;

            document.getElementById("greeting").textContent = nickname + ", твой герой готов!";

            const hpPercent = (hero.hp / maxHp) * 100;
            const damagePercent = (hero.damage / maxDamage) * 100;
            document.getElementById("hpBar").style.width = hpPercent + "%";
            document.getElementById("damageBar").style.width = damagePercent + "%";
        });
    </script>

    <script>
        const slides = document.querySelectorAll(".hero-bg");

        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove("active");

            currentSlide = (currentSlide + 1) % slides.length;

            slides[currentSlide].classList.add("active");
        }, 5000);
</script>
</body>
</html>

</body></html>
